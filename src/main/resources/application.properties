# --- SERVIDOR ---
server.port=8082
spring.application.name=ordenes-service

# --- BASE DE DATOS ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Servispeed
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# --- Archivos ---
file.upload-dir=uploads

# --- MQTT ---
mqtt.broker-url=tcp://172.17.0.1:1883
mqtt.client-id=ordenes-service-publisher
mqtt.default-topic=sigi/notifications/ordenes
mqtt.connection-timeout=10
mqtt.keep-alive-interval=30